[package]
name = "rhystic_core"
version = "0.1.0"
edition = "2021"
description = "Hot-core primitives for the Ralgorithm Rhystic/Heartwood simulator."

[lib]
name = "rhystic_core"
path = "src/lib.rs"

[[bin]]
name = "rhystic-core-smoke"
path = "src/main.rs"

[dependencies]
blake2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
